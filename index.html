<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast hide" id="toast"></div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
/* 1つのファイルに参加者ページと運営ページが入っています。
   参加者: …/  運営: …/#admin(合言葉は Code.gs の ADMIN_PASS でだけ確認され、このファイルには書かれていません) */
/* 参加者ページ */
function runParticipant() {
'use strict';

var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = WB.esc;

var S = {
  lang: 'en', pid: '', name: '', title: 'Workshop Board',
  st: null, ver: { q: -1, p: -1, a: -1, qa: -1, c: -1 }, busy: {}, lastFetch: {},
  questions: [], roster: [], answers: [], qa: [], comments: [],
  dq: '', dDraft: {}, imgs: {}, rec: null, dSig: '', cTo: '', cFilter: 'all', tabSig: '',
  mine: {}, drafts: {}, qaDraft: '', qaKind: 'question',
  tab: 'q', sort: 'q', fq: '', fg: '', qaFilter: 'all',
  showOther: WB.ls('wb.other') !== '0',
  online: true, started: false, pollT: 0, hdrSig: '', bctlSig: '', meChecked: -1
};
function T(k, v) { return WB.t(S.lang, k, v); }

var ICONS = {
  q: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  board: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  qa: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5"/><path d="M12 17h.01"/></svg>',
  disc: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1.1-4.6A8 8 0 1121 12z"/></svg>',
  g: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/></svg>'
};

/* ───────── 小さな道具 ───────── */

var toastT;
function toast(msg, err) {
  var el = $('#toast'); el.textContent = msg; el.className = 'toast' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(function () { el.className = 'toast hide'; }, 2600);
}

/* 入力中の欄は、通信で届いた更新で作り直さない（カーソルが飛ぶので）。
   フォーカスが外れたら、保留していた描画をやり直す。 */
var pending = {};
function safe(name, el, fn) {
  var a = document.activeElement;
  if (el && a && el.contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) { pending[name] = { el: el, fn: fn }; return; }
  delete pending[name]; fn();
}
document.addEventListener('focusout', function () {
  setTimeout(function () {
    Object.keys(pending).forEach(function (n) { var p = pending[n]; delete pending[n]; safe(n, p.el, p.fn); });
  }, 60);
});

function clientId() {
  var c = WB.ls('wb.client');
  if (!c) { c = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); WB.ls('wb.client', c); }
  return c;
}

function langSw() {
  return '<div class="langsw">' + WB_LANGS.map(function (l) {
    return '<button data-l="' + l.code + '" class="' + (S.lang === l.code ? 'on' : '') + '" lang="' + l.code + '">' + esc(l.name) + '</button>';
  }).join('') + '</div>';
}
function bindLangSw(root) {
  [].forEach.call(root.querySelectorAll('.langsw button, .langbig button'), function (b) {
    b.onclick = function () { setLang(b.getAttribute('data-l')); };
  });
}
function setLang(l) {
  S.lang = l; WB.ls('wb.lang', l); document.documentElement.lang = l;
  if (S.started) { S.hdrSig = ''; S.bctlSig = ''; renderAll(); } else showRegister();
}

function qLang(q) { return q[S.lang] ? S.lang : (q.en ? 'en' : (q.ja ? 'ja' : 'bn')); }
function myGroup() {
  for (var i = 0; i < S.roster.length; i++) if (S.roster[i].p === S.pid) return S.roster[i].g || '';
  return '';
}
function rosterMap() { var m = {}; S.roster.forEach(function (r) { m[r.p] = r; }); return m; }
/* 問いの表示先: ans=問いタブだけ / disc=考えるタブだけ / both=両方 */
function ansQs() { return S.questions.filter(function (q) { return q.mode !== 'disc'; }); }
function discQs() { return S.questions.filter(function (q) { return q.mode !== 'ans'; }); }
function qIndex(id) { var a = ansQs(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return i; return -1; }
function dIndex(id) { var a = discQs(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return i; return -1; }

/* ───────── 起動 ───────── */

function boot() {
  S.lang = WB.ls('wb.lang') || '';
  var pid = WB.ls('wb.pid'), name = WB.ls('wb.name');
  WB.get('state').then(function (res) {
    if (res.ok) { S.st = res.state; S.title = res.state.title || S.title; document.title = S.title; }
    if (!S.lang) S.lang = (res.ok && res.state.defaultLang) || WB.detectUiLang();
    document.documentElement.lang = S.lang;
    if (!pid) return showRegister();
    WB.get('me', { pid: pid }).then(function (m) {
      if (m.ok && m.found) { S.pid = m.pid; S.name = m.name; startApp(); }
      else if (m.ok && !m.found) { WB.ls('wb.pid', null); showRegister(T('gone')); }
      else { S.pid = pid; S.name = name || ''; startApp(); }      /* 通信できないときは、保存してある情報でそのまま開く */
    });
  });
}

/* ───────── 名前の入力 ───────── */

function showRegister(msg) {
  S.started = false; clearTimeout(S.pollT);
  var nv = ($('#rgName') || {}).value || '', av = ($('#rgAff') || {}).value || '';
  var app = $('#app'); app.className = 'wrap';
  app.innerHTML =
    '<header class="board"><div class="bTop"><span class="bMark">' + esc(S.title) + '</span></div>' +
    '<div style="color:var(--chalk);font-size:22px;font-weight:700;line-height:1.5">' + esc(T('welcome')) + '</div></header>' +
    '<div class="tray"><i></i><i></i></div>' +
    '<div class="entry">' +
      '<div><label>' + esc(T('lang')) + '</label><div class="langbig">' + WB_LANGS.map(function (l) {
        return '<button data-l="' + l.code + '" class="' + (S.lang === l.code ? 'on' : '') + '" lang="' + l.code + '">' + esc(l.name) + '</button>';
      }).join('') + '</div></div>' +
      '<div><label for="rgName">' + esc(T('nameLabel')) + '</label><input type="text" id="rgName" maxlength="60" autocomplete="name" placeholder="' + esc(T('namePh')) + '" lang="' + S.lang + '"></div>' +
      '<div><label for="rgAff">' + esc(T('affilLabel')) + '</label><input type="text" id="rgAff" maxlength="60" placeholder="' + esc(T('affilPh')) + '" lang="' + S.lang + '"></div>' +
      '<p class="hint" style="margin:0">' + esc(T('rejoin')) + '</p>' +
      '<div class="err" id="rgErr">' + esc(msg || '') + '</div>' +
      '<button class="btn" id="rgGo">' + esc(T('start')) + '</button>' +
    '</div>';
  $('#rgName').value = nv; $('#rgAff').value = av;
  bindLangSw(app);
  var go = function () {
    var name = $('#rgName').value.trim();
    if (!name) { $('#rgErr').textContent = T('errName'); return; }
    var btn = $('#rgGo'); btn.disabled = true; $('#rgErr').textContent = '';
    WB.post({ type: 'register', name: name, affil: $('#rgAff').value.trim(), lang: S.lang, client: clientId() }).then(function (r) {
      btn.disabled = false;
      if (r.ok) { WB.ls('wb.pid', r.pid); WB.ls('wb.name', r.name); S.pid = r.pid; S.name = r.name; startApp(); }
      else $('#rgErr').textContent = r.error === 'name' ? T('errName') : T('errNet');
    });
  };
  $('#rgGo').onclick = go;
  $('#rgName').onkeydown = function (e) { if (e.key === 'Enter') go(); };
}

/* ───────── 本体 ───────── */

function startApp() {
  S.started = true; S.drafts = {}; S.mine = {}; S.ver = { q: -1, p: -1, a: -1, qa: -1, c: -1 }; S.dDraft = {}; S.imgs = {}; S.comments = [];
  S.hdrSig = ''; S.bctlSig = ''; S.meChecked = -1; S.busy = {}; S.lastFetch = {};
  var app = $('#app'); app.className = 'wrap';
  app.innerHTML =
    '<div class="offline hide" id="off"></div>' +
    '<header class="board" id="hdr"></header><div class="tray"><i></i><i></i></div>' +
    '<main class="main"><section id="v-q"></section><section id="v-disc" class="hide"></section><section id="v-board" class="hide"></section>' +
    '<section id="v-qa" class="hide"></section><section id="v-g" class="hide"></section></main>' +
    '<nav class="tabs" id="tabs"></nav>';
  S.tab = visibleTabs()[0]; S.tabSig = visibleTabs().join();
  renderAll();
  ['questions', 'roster', 'answers', 'qa', 'comments'].forEach(refresh);
  clearTimeout(S.pollT); poll();
}

function renderAll() {
  renderHeader(); renderTabs(); renderQ(); renderDisc(); renderBoardShell(); renderQA(); renderGroup(); showTab(S.tab, true);
}

function showTab(t, keepScroll) {
  S.tab = t;
  if (t !== 'disc') stopMic();
  var app = $('#app'); if (app) app.classList.toggle('wide', t === 'disc');
  ['q', 'disc', 'board', 'qa', 'g'].forEach(function (x) {
    var s = $('#v-' + x); if (s) s.classList.toggle('hide', x !== t);
  });
  if (t === 'disc') { renderDiscList(true); }
  renderTabs();
  if (!keepScroll) window.scrollTo(0, 0);
}

function renderTabs() {
  var el = $('#tabs'); if (!el) return;
  var vis = visibleTabs();
  var items = [['q', 'tabQ'], ['disc', 'tabDisc'], ['board', 'tabBoard'], ['qa', 'tabQA'], ['g', 'tabGroup']].filter(function (i) { return vis.indexOf(i[0]) >= 0; });
  el.innerHTML = items.map(function (i) {
    return '<button data-t="' + i[0] + '" class="' + (S.tab === i[0] ? 'on' : '') + '">' + ICONS[i[0]] + '<span>' + esc(T(i[1])) + '</span></button>';
  }).join('');
  [].forEach.call(el.querySelectorAll('button'), function (b) { b.onclick = function () { showTab(b.getAttribute('data-t')); }; });
}

function renderHeader() {
  var el = $('#hdr'); if (!el) return;
  var g = myGroup(), sig = [S.title, S.name, g, S.lang].join('|');
  if (sig === S.hdrSig) return;
  S.hdrSig = sig;
  el.innerHTML =
    '<div class="bTop"><span class="bMark">' + esc(S.title) + '</span>' + langSw() + '</div>' +
    '<div class="bRow"><div class="who"><b lang="' + S.lang + '">' + esc(S.name) + '</b>' +
      (g ? '<span class="gb" style="--g:' + WB.gcolor(g) + '">' + esc(T('groupN', { n: g })) + '</span>' : '') + '</div>' +
      '<div class="timer off" id="tm"><span id="tmv">--:--</span></div></div>' +
    '<div class="tlabel" id="tml"></div><div class="guide hide" id="gd"></div>';
  bindLangSw(el); tick(); renderGuide();
}

/* 運営が出す「いまやること」の一行 */
function renderGuide() {
  var el = $('#gd'); if (!el) return;
  var g = S.st && S.st.guide, txt = g ? (g[S.lang] || g.ja || g.en || g.bn || '') : '';
  if (el.textContent !== txt) el.textContent = txt;
  el.classList.toggle('hide', !txt);
}

/* 運営が選んだ「いま使うタブ」だけを出す */
function visibleTabs() {
  var all = ['q', 'disc', 'board', 'qa', 'g'], t = S.st && S.st.tabs;
  return t && t.length ? all.filter(function (k) { return t.indexOf(k) >= 0; }) : all;
}

function renderOffline() {
  var el = $('#off'); if (!el) return;
  el.textContent = T('offline'); el.classList.toggle('hide', S.online);
}

/* ───────── タイマー（いつでも見える） ───────── */

function tick() {
  var box = $('#tm'), v = $('#tmv'), lab = $('#tml'); if (!box) return;
  var tm = S.st && S.st.timer, rem = WB.remaining(tm), cls = 'timer', txt = '--:--', label = '';
  if (rem === null) { cls += ' off'; label = T('timerNone'); }
  else if (tm.run) {
    if (rem <= 0) { cls += ' end'; txt = '0:00'; label = T('timeUp'); }
    else { if (rem < 60000) cls += ' warn'; txt = WB.fmt(rem); label = tm.label || ''; }
  } else { cls += ' warn'; txt = WB.fmt(rem); label = (tm.label ? tm.label + ' · ' : '') + T('paused'); }
  if (box.className !== cls) box.className = cls;
  if (v.textContent !== txt) v.textContent = txt;
  if (lab.textContent !== label) lab.textContent = label;
}
setInterval(tick, 250);

/* ───────── 通信（状態を取りに行く） ───────── */

var LISTS = { questions: 'q', roster: 'p', answers: 'a', qa: 'qa', comments: 'c' };

function poll() {
  S.pollT = setTimeout(poll, (WB.cfg.pollSec || 6) * 1000 + Math.random() * 1500);   /* 端末ごとにずらす */
  if (document.hidden) return;                                                         /* 見ていない間は取りに行かない */
  WB.get('state').then(function (res) {
    if (res.ok) { S.online = true; applyState(res.state); } else S.online = false;
    renderOffline();
  });
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.started) { clearTimeout(S.pollT); poll(); }
});

function applyState(st) {
  S.st = st; S.title = st.title || S.title; document.title = S.title;
  Object.keys(LISTS).forEach(function (n) { if (S.ver[LISTS[n]] < st.v[LISTS[n]]) refresh(n); });
  renderHeader(); tick(); renderGuide();
  var vis = visibleTabs(), tsig = vis.join();
  if (tsig !== S.tabSig) {
    S.tabSig = tsig;
    if (vis.indexOf(S.tab) < 0) showTab(vis[0]); else renderTabs();
  }
  if (S.tab === 'g') renderGroup();
}

function refresh(name) {
  if (S.busy[name] || Date.now() - (S.lastFetch[name] || 0) < 1500) return;
  S.busy[name] = true; S.lastFetch[name] = Date.now();
  WB.get(name).then(function (res) {
    S.busy[name] = false;
    if (!res.ok) { S.online = false; renderOffline(); return; }
    S.online = true; renderOffline();
    S.ver[LISTS[name]] = res.v;
    onList(name, res);
  });
}

function onList(name, res) {
  if (name === 'questions') {
    S.questions = res.questions; initDrafts();
    safe('q', $('#v-q'), renderQ); safe('disc', $('#v-disc'), renderDisc); renderBoardCtl(); renderBoardList(); renderQAList();
  } else if (name === 'roster') {
    S.roster = res.roster; renderHeader(); renderGroup(); renderBoardCtl(); renderBoardList(); renderQAList(); renderDiscList(); refreshTo(); checkMe();
  } else if (name === 'answers') {
    S.answers = res.answers; deriveMine(); renderBoardList();
  } else if (name === 'qa') {
    S.qa = res.qa; renderQAList();
  } else if (name === 'comments') {
    S.comments = res.comments; renderDiscList();
  }
}

/* 運営に削除された場合などに、名前の入力へ戻す（一覧は少し古いことがあるので、直接たしかめる） */
function checkMe() {
  var found = S.roster.some(function (r) { return r.p === S.pid; });
  if (found || S.meChecked === S.ver.p) return;
  S.meChecked = S.ver.p;
  WB.get('me', { pid: S.pid }).then(function (m) {
    if (m.ok && !m.found) { WB.ls('wb.pid', null); showRegister(T('gone')); }
  });
}

/* ───────── 問い ───────── */

function dkey(qid) { return 'wb.d.' + S.pid + '.' + qid; }
function initDrafts() {
  S.questions.forEach(function (q) {
    if (S.drafts[q.id] === undefined) { var d = WB.ls(dkey(q.id)); if (d !== null && d !== undefined) S.drafts[q.id] = d; }
  });
}
function deriveMine() {
  S.answers.forEach(function (a) {
    if (a.p !== S.pid) return;
    S.mine[a.q] = { text: a.t, rev: a.r };
    if (S.drafts[a.q] === undefined) {                      /* 別の端末で書いた回答を、この端末にも出す */
      S.drafts[a.q] = a.t;
      var ta = $('#ta-' + a.q); if (ta && document.activeElement !== ta) ta.value = a.t;
    }
  });
  updAllQ();
}

function qCard(q, i) {
  var others = '';
  if (S.showOther) {
    others = WB_LANGS.filter(function (l) { return l.code !== S.lang && q[l.code]; }).map(function (l) {
      return '<span lang="' + l.code + '">' + esc(q[l.code]) + '</span>';
    }).join('');
  }
  return '<article class="qc"><div class="qhead"><span class="qno">' + esc(T('qN', { n: i + 1 })) + '</span><span class="qstat" id="qs-' + q.id + '"></span></div>' +
    '<p class="qtx" lang="' + qLang(q) + '">' + esc(WB.qText(q, S.lang)) + '</p>' +
    (others ? '<p class="qother">' + others + '</p>' : '') +
    '<textarea id="ta-' + q.id + '" data-q="' + q.id + '" lang="' + S.lang + '" placeholder="' + esc(T('write')) + '"></textarea>' +
    '<div class="rowb"><span class="hint">' + esc(T('autoSaved')) + '</span><button class="btn sm" id="bt-' + q.id + '" data-q="' + q.id + '"></button></div></article>';
}

function renderQ() {
  var el = $('#v-q'); if (!el) return;
  var AQ = ansQs();
  if (!AQ.length) { el.innerHTML = '<div class="empty">' + esc(T('noQuestions')) + '</div>'; return; }
  el.innerHTML =
    '<div class="rowb" style="margin-bottom:12px"><span class="hint" style="flex:1 1 200px">' + esc(T('translateNote')) + '</span>' +
    '<label class="chk"><input type="checkbox" id="showOther"' + (S.showOther ? ' checked' : '') + '> ' + esc(T('showOther')) + '</label></div>' +
    '<div class="qgrid">' + AQ.map(qCard).join('') + '</div>';
  $('#showOther').onchange = function () { S.showOther = this.checked; WB.ls('wb.other', this.checked ? '1' : '0'); renderQ(); };
  AQ.forEach(function (q) {
    var ta = $('#ta-' + q.id);
    ta.value = S.drafts[q.id] !== undefined ? S.drafts[q.id] : '';
    ta.oninput = function () { S.drafts[q.id] = ta.value; WB.ls(dkey(q.id), ta.value); updQ(q.id); };
    $('#bt-' + q.id).onclick = function () { sendAnswer(q.id); };
    updQ(q.id);
  });
}

function updQ(qid) {
  var ta = $('#ta-' + qid), bt = $('#bt-' + qid), st = $('#qs-' + qid); if (!ta || !bt || !st) return;
  var cur = (ta.value || '').trim(), m = S.mine[qid], sent = m ? m.text : '';
  if (m && cur === sent) { st.textContent = T('sentOk') + ' ✓'; st.className = 'qstat ok'; bt.textContent = T('sentOk'); bt.disabled = true; }
  else if (!cur) { st.textContent = m ? T('sentOk') + ' ✓' : T('unsent'); st.className = 'qstat' + (m ? ' ok' : ''); bt.textContent = T('send'); bt.disabled = true; }
  else { st.textContent = T('unsent'); st.className = 'qstat'; bt.textContent = m ? T('sendChanges') : T('send'); bt.disabled = false; }
}
function updAllQ() { S.questions.forEach(function (q) { updQ(q.id); }); }

function sendAnswer(qid) {
  var text = (S.drafts[qid] || '').trim();
  if (!text) { toast(T('emptyErr'), true); return; }
  var bt = $('#bt-' + qid); bt.disabled = true;
  WB.post({ type: 'answer', pid: S.pid, qid: qid, text: text, lang: S.lang }).then(function (r) {
    if (r.ok) {
      S.mine[qid] = { text: text, rev: r.revision };
      upsertAnswer(qid, text, r);
      toast(r.duplicate ? T('nochange') : T('sentMsg'));
    } else if (r.error === 'nopid') { WB.ls('wb.pid', null); showRegister(T('gone')); return; }
    else toast(T('fail'), true);
    updQ(qid);
  });
}

function upsertAnswer(qid, text, r) {
  var rec = { q: qid, p: S.pid, l: r.lang, t: text, ja: r.ja, en: r.en, bn: r.bn, r: r.revision, ts: Date.now() }, found = false;
  S.answers = S.answers.map(function (a) { if (a.q === qid && a.p === S.pid) { found = true; return rec; } return a; });
  if (!found) S.answers.push(rec);
  renderBoardList();
}

/* ───────── 考える（写真を見て、みんなでコメント） ───────── */

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var MIC_LANG = { ja: 'ja-JP', en: 'en-US', bn: 'bn-BD' };

function discQ() {
  var D = discQs();
  for (var i = 0; i < D.length; i++) if (D[i].id === S.dq) return D[i];
  return D[0] || null;
}

function refreshTo() {
  var sel = $('#cTo'); if (!sel || document.activeElement === sel) return;
  var sig = S.roster.map(function (r) { return r.p + r.n + r.g; }).join();
  if (sel.getAttribute('data-sig') === sig) return;
  sel.setAttribute('data-sig', sig); sel.innerHTML = toOptions();
}

/* 宛先の候補:同じグループの人 → ほかの人（自分は除く） */
function toOptions() {
  var g = myGroup(), mine = [], others = [];
  S.roster.forEach(function (r) {
    if (r.p === S.pid) return;
    (g && r.g === g ? mine : others).push(r);
  });
  var byN = function (a, b) { return WB.cmp(a.n, b.n); };
  mine.sort(byN); others.sort(byN);
  var opt = function (r) { return '<option value="' + r.p + '"' + (S.cTo === r.p ? ' selected' : '') + '>' + esc(r.n) + '</option>'; };
  return '<option value="">' + esc(T('toAll')) + '</option>' +
    (mine.length ? '<optgroup label="' + esc(T('toGroup')) + '">' + mine.map(opt).join('') + '</optgroup>' : '') +
    (others.length ? (mine.length ? '<optgroup label="' + esc(T('toOthers')) + '">' : '') + others.map(opt).join('') + (mine.length ? '</optgroup>' : '') : '');
}

function renderDisc() {
  var el = $('#v-disc'); if (!el) return;
  stopMic();
  var q = discQ();
  if (!q) { el.innerHTML = '<div class="empty">' + esc(T('noQuestions')) + '</div>'; return; }
  S.dq = q.id; S.dSig = '';
  el.innerHTML =
    '<p class="hint" style="margin:0">' + esc(T('discHint')) + '</p>' +
    '<div class="dwrap"><div class="dq" id="dq"></div><div class="dleft" id="dleft"></div>' +
    '<div class="dright"><h3>' + esc(T('cmtTitle')) + ' <span class="n" id="dn"></span></h3><div class="chips" id="cflt"></div><div class="clist" id="clist"></div></div>' +
    '<div class="cin"><div class="toRow"><label for="cTo">' + esc(T('toLabel')) + '</label><select id="cTo" lang="' + S.lang + '">' + toOptions() + '</select></div>' +
    '<textarea id="cTa" lang="' + S.lang + '" placeholder="' + esc(T('cmtPh')) + '"></textarea>' +
    '<div class="tpls">' + ['tplGood', 'tplHelp', 'tplAsk'].map(function (k) { return '<button type="button" class="chip" data-tpl="' + k + '">' + esc(T(k)) + '</button>'; }).join('') + '</div>' +
    '<div class="listen hide" id="cListen"></div>' +
    '<div class="rowc">' + (SR ? '<button class="mic" id="cMic" type="button" aria-label="' + esc(T('micOn')) + '" title="' + esc(T('micOn')) + '">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></svg></button>' : '') +
    '<button class="btn" id="cSend" type="button">' + esc(T('post')) + '</button></div></div></div>';
  renderDiscHead();
  var ta = $('#cTa'); ta.value = S.dDraft[q.id] || '';
  ta.oninput = function () { S.dDraft[q.id] = ta.value; };
  ta.onkeydown = function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendComment(); } };
  $('#cSend').onclick = sendComment;
  $('#cTo').onchange = function () { S.cTo = this.value; };
  [].forEach.call(document.querySelectorAll('[data-tpl]'), function (b) {
    b.onclick = function () {
      var txt = T(b.getAttribute('data-tpl')) + ' ', cur = ta.value;
      ta.value = cur && !/\s$/.test(cur) ? cur + '\n' + txt : cur + txt;
      S.dDraft[q.id] = ta.value; ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
    };
  });
  if (SR) $('#cMic').onclick = micToggle;
  renderDiscList(true);
}

function renderDiscHead() {
  var q = discQ(); if (!q) return;
  var dq = $('#dq'), left = $('#dleft'); if (!dq || !left) return;
  dq.innerHTML = discQs().map(function (x, i) {
    return '<button class="chip' + (x.id === q.id ? ' on' : '') + '" data-q="' + x.id + '">' + esc(T('qN', { n: i + 1 })) +
      (x.img ? ' ·&#128247;' : '') + '</button>';
  }).join('');
  [].forEach.call(dq.querySelectorAll('button'), function (b) {
    b.onclick = function () { S.dq = b.getAttribute('data-q'); renderDisc(); };
  });
  var others = '';
  if (S.showOther) {
    others = WB_LANGS.filter(function (l) { return l.code !== S.lang && q[l.code]; }).map(function (l) {
      return '<span lang="' + l.code + '">' + esc(q[l.code]) + '</span>';
    }).join('');
  }
  left.innerHTML = (q.img ? '<div class="dimg" id="dimg"></div>' : '') +
    '<div class="dqbox"><div><span class="qno">' + esc(T('qN', { n: dIndex(q.id) + 1 })) + '</span></div>' +
    '<p class="qtx" lang="' + qLang(q) + '">' + esc(WB.qText(q, S.lang)) + '</p>' +
    (others ? '<p class="qother">' + others + '</p>' : '') + '</div>';
  if (q.img) updImg(q);
}

function updImg(q) {
  var box = $('#dimg'), cur = discQ(); if (!box || !q || !cur || cur.id !== q.id) return;
  var im = S.imgs[q.id];
  if (im && im.ver === q.img && im.data) {
    box.innerHTML = '<img alt="" src="' + im.data + '"><span class="tap">' + esc(T('imgTap')) + '</span>';
    $('img', box).onclick = function () {
      var z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<img alt="" src="' + im.data + '">';
      z.onclick = function () { z.remove(); }; document.body.appendChild(z);
    };
  } else if (im && im.ver === q.img && im.err) {
    box.innerHTML = '<button class="st" type="button">' + esc(T('imgFail')) + '</button>';
    $('button', box).onclick = function () { delete S.imgs[q.id]; ensureImg(q); updImg(q); };
  } else {
    box.innerHTML = '<div class="st">' + esc(T('imgLoad')) + '</div>';
    ensureImg(q);
  }
}

function ensureImg(q) {
  var im = S.imgs[q.id];
  if (im && im.ver === q.img && (im.data || im.loading || im.err)) return;
  S.imgs[q.id] = { ver: q.img, loading: true };
  WB.get('image', { qid: q.id, v: q.img }).then(function (res) {
    if (res.ok && res.data) S.imgs[q.id] = { ver: res.ver, data: res.data };
    else if (res.error === 'stale') { delete S.imgs[q.id]; S.lastFetch.questions = 0; refresh('questions'); return; }
    else S.imgs[q.id] = { ver: q.img, err: true };
    var cur = discQ(); if (cur && cur.id === q.id) updImg(cur);
  });
}

function renderDiscList(force) {
  var box = $('#clist'), q = discQ(); if (!box || !q) return;
  var rm = rosterMap();
  var all = S.comments.filter(function (c) { return c.q === q.id; });
  var nMe = all.filter(function (c) { return c.to === S.pid; }).length;
  if (S.cFilter === 'me' && !nMe) S.cFilter = 'all';
  var items = S.cFilter === 'me' ? all.filter(function (c) { return c.to === S.pid; }) : all;
  var sig = [q.id, S.lang, S.pid, S.cFilter, nMe, items.map(function (c) {
    var r = rm[c.p], t = c.to && rm[c.to]; return c.id + (r ? r.n + r.g : '') + (t ? t.n : '');
  }).join(',')].join('|');
  if (!force && sig === S.dSig) return;
  var first = S.dSig === '' || force;
  var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 70, st = box.scrollTop;
  S.dSig = sig;
  var n = $('#dn'); if (n) n.textContent = all.length ? '(' + all.length + ')' : '';
  var fl = $('#cflt');
  if (fl) {
    fl.innerHTML = nMe ? [['all', T('all'), all.length], ['me', T('fltMe'), nMe]].map(function (d) {
      return '<button class="chip' + (S.cFilter === d[0] ? ' on' : '') + '" data-f="' + d[0] + '">' + esc(d[1]) + ' (' + d[2] + ')</button>';
    }).join('') : '';
    [].forEach.call(fl.querySelectorAll('button'), function (b) { b.onclick = function () { S.cFilter = b.getAttribute('data-f'); renderDiscList(true); }; });
  }
  box.innerHTML = items.length ? items.map(function (c) {
    var r = rm[c.p], g = r && r.g, tr = (c.l !== S.lang && c[S.lang]) ? c[S.lang] : null;
    var tor = c.to && rm[c.to];
    return '<div class="cm' + (c.p === S.pid ? ' mine' : '') + (c.to === S.pid ? ' tome' : '') + '"><div class="who2"><span>' + esc(r ? r.n : '—') + (c.p === S.pid ? ' (' + esc(T('mine')) + ')' : '') +
      (c.to ? ' → ' + (c.to === S.pid ? '<b class="toyou">' + esc(T('toYou')) + '</b>' : esc(tor ? tor.n : '—')) : '') + '</span>' +
      (g ? '<span class="gb" style="--g:' + WB.gcolor(g) + ';height:16px;min-width:16px;font-size:10px">' + esc(g) + '</span>' : '') +
      '<span>' + esc(hhmm(c.ts)) + '</span></div>' +
      '<p lang="' + (tr ? S.lang : c.l) + '">' + esc(tr || c.t) + '</p>' +
      (tr ? '<div class="tr" lang="' + c.l + '"><small>' + esc(T('original')) + ' · ' + esc(WB.langName(c.l)) + '</small>' + esc(c.t) + '</div>' : '') + '</div>';
  }).join('') : '<div class="empty" style="padding:22px 8px">' + esc(T('noCmt')) + '</div>';
  box.scrollTop = (first || nearBottom) ? box.scrollHeight : st;
}

function sendComment() {
  var q = discQ(), ta = $('#cTa'), bt = $('#cSend'); if (!q || !ta) return;
  stopMic();
  var text = ta.value.trim();
  if (!text) { toast(T('emptyErr'), true); return; }
  bt.disabled = true;
  WB.post({ type: 'comment', pid: S.pid, qid: q.id, text: text, lang: S.lang, to: S.cTo }).then(function (r) {
    bt.disabled = false;
    if (r.ok) {
      S.dDraft[q.id] = ''; if ($('#cTa')) $('#cTa').value = '';
      S.comments = S.comments.concat([{ id: r.id, ts: Date.now(), q: q.id, p: S.pid, to: r.to || '', l: r.lang || S.lang, t: text, ja: r.ja || '', en: r.en || '', bn: r.bn || '' }]);
      renderDiscList(true); toast(T('posted'));
      S.lastFetch.comments = 0; refresh('comments');
    } else if (r.error === 'nopid') { WB.ls('wb.pid', null); showRegister(T('gone')); }
    else toast(T('fail'), true);
  });
}

/* 音声入力（端末のブラウザの機能。使えない端末ではボタンごと出さない） */
function setMicUi(on) {
  var b = $('#cMic'), l = $('#cListen');
  if (b) b.classList.toggle('on', !!on);
  if (l) { l.textContent = on ? T('micListening') : ''; l.classList.toggle('hide', !on); }
}
function stopMic() {
  if (S.rec) { try { S.rec.abort(); } catch (e) {} S.rec = null; }
  setMicUi(false);
}
function micToggle() {
  if (S.rec) { try { S.rec.stop(); } catch (e) {} return; }
  var ta = $('#cTa'), q = discQ(); if (!SR || !ta || !q) return;
  var base = ta.value, sep = base && !/\s$/.test(base) ? ' ' : '';
  var r = new SR();
  r.lang = MIC_LANG[S.lang] || 'en-US'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  r.onresult = function (e) {
    var fin = '', tmp = '';
    for (var i = 0; i < e.results.length; i++) {
      var x = e.results[i]; if (x.isFinal) fin += x[0].transcript; else tmp += x[0].transcript;
    }
    ta.value = base + sep + fin + tmp; S.dDraft[q.id] = ta.value;
  };
  r.onerror = function (e) {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast(T('micDenied'), true);
    else if (e.error !== 'aborted') toast(T('micErr'), true);
  };
  r.onend = function () { if (S.rec === r) S.rec = null; setMicUi(false); };
  try { r.start(); S.rec = r; setMicUi(true); } catch (err) { S.rec = null; setMicUi(false); toast(T('micErr'), true); }
}

/* ───────── ボード ───────── */

function renderBoardShell() {
  var el = $('#v-board'); if (!el) return;
  el.innerHTML = '<p class="hint" style="margin:0">' + esc(T('boardNote')) + '</p><div class="ctl" id="bctl"></div><div id="bl" style="display:flex;flex-direction:column;gap:14px"></div>';
  S.bctlSig = ''; renderBoardCtl(); renderBoardList();
}

function groupList() {
  var seen = {};
  S.roster.forEach(function (r) { if (r.g) seen[r.g] = 1; });
  return Object.keys(seen).sort(function (a, b) { return a - b; });
}

function renderBoardCtl() {
  var el = $('#bctl'); if (!el) return;
  var gs = groupList();
  var sig = [S.lang, S.sort, S.fq, S.fg, ansQs().map(function (q) { return q.id; }).join(), gs.join()].join('|');
  if (sig === S.bctlSig) return;
  S.bctlSig = sig;
  el.innerHTML =
    '<div class="seg2"><button data-s="q" class="' + (S.sort === 'q' ? 'on' : '') + '">' + esc(T('byQ')) + '</button>' +
    '<button data-s="g" class="' + (S.sort === 'g' ? 'on' : '') + '">' + esc(T('byG')) + '</button></div>' +
    '<select id="fq" lang="' + S.lang + '"><option value="">' + esc(T('allQ')) + '</option>' + ansQs().map(function (q, i) {
      return '<option value="' + q.id + '"' + (S.fq === q.id ? ' selected' : '') + '>' + esc(T('qN', { n: i + 1 })) + '</option>';
    }).join('') + '</select>' +
    '<select id="fg" lang="' + S.lang + '"><option value="">' + esc(T('allG') ) + '</option>' + gs.map(function (g) {
      return '<option value="' + g + '"' + (S.fg === g ? ' selected' : '') + '>' + esc(T('groupN', { n: g })) + '</option>';
    }).join('') + '</select>';
  [].forEach.call(el.querySelectorAll('.seg2 button'), function (b) {
    b.onclick = function () { S.sort = b.getAttribute('data-s'); S.bctlSig = ''; renderBoardCtl(); renderBoardList(); };
  });
  $('#fq').onchange = function () { S.fq = this.value; S.bctlSig = ''; renderBoardList(); };
  $('#fg').onchange = function () { S.fg = this.value; S.bctlSig = ''; renderBoardList(); };
}

function boardItems() {
  var rm = rosterMap(), out = [];
  S.answers.forEach(function (a) {
    var r = rm[a.p], qi = qIndex(a.q);
    if (!r || qi < 0) return;
    if (S.fq && a.q !== S.fq) return;
    if (S.fg && String(r.g) !== S.fg) return;
    out.push({ a: a, name: r.n, g: r.g, qi: qi, mine: a.p === S.pid });
  });
  return out;
}

function card(it, mode) {
  var a = it.a, tr = (a.l !== S.lang && a[S.lang]) ? a[S.lang] : null;
  var tag = mode === 'q' ? (it.g ? T('groupN', { n: it.g }) : T('noGroup')) : T('qN', { n: it.qi + 1 });
  return '<div class="cardn' + (it.mine ? ' mine' : '') + '" style="--g:' + (it.g ? WB.gcolor(it.g) : '#8C8275') + '">' +
    '<div class="wh">' + esc(it.name) + (it.mine ? ' (' + esc(T('mine')) + ')' : '') + ' · ' + esc(tag) + '</div>' +
    '<p lang="' + (tr ? S.lang : a.l) + '">' + esc(tr || a.t) + '</p>' +
    (tr ? '<div class="tr" lang="' + a.l + '"><small>' + esc(T('original')) + ' · ' + esc(WB.langName(a.l)) + '</small>' + esc(a.t) + '</div>' : '') +
    '</div>';
}

function renderBoardList() {
  var el = $('#bl'); if (!el) return;
  var items = boardItems(), html = '';
  var byName = function (a, b) { return WB.cmp(a.name, b.name); };
  if (!items.length && !ansQs().length) { el.innerHTML = '<div class="empty">' + esc(T('noAnswers')) + '</div>'; return; }

  if (S.sort === 'q') {
    ansQs().forEach(function (q, i) {
      if (S.fq && q.id !== S.fq) return;
      var list = items.filter(function (it) { return it.a.q === q.id; })
        .sort(function (a, b) { return (parseInt(a.g, 10) || 999) - (parseInt(b.g, 10) || 999) || byName(a, b); });
      html += '<div class="sec"><div class="sech"><h3 lang="' + qLang(q) + '">' + esc(T('qN', { n: i + 1 })) + ' · ' + esc(WB.qText(q, S.lang)) + '</h3><span class="n">' + list.length + '</span></div>' +
        (list.length ? '<div class="grid">' + list.map(function (it) { return card(it, 'q'); }).join('') + '</div>' : '<div class="empty">' + esc(T('noAnswers')) + '</div>') + '</div>';
    });
  } else {
    var by = {};
    items.forEach(function (it) { var k = it.g || '0'; (by[k] = by[k] || []).push(it); });
    var keys = Object.keys(by).sort(function (a, b) { return (a === '0' ? 9999 : +a) - (b === '0' ? 9999 : +b); });
    keys.forEach(function (k) {
      var list = by[k].sort(function (a, b) { return a.qi - b.qi || byName(a, b); });
      html += '<div class="sec"><div class="sech"><h3><span class="gb" style="--g:' + (k === '0' ? '#8C8275' : WB.gcolor(k)) + '">' +
        esc(k === '0' ? T('noGroup') : T('groupN', { n: k })) + '</span></h3><span class="n">' + list.length + '</span></div>' +
        '<div class="grid">' + list.map(function (it) { return card(it, 'g'); }).join('') + '</div></div>';
    });
    if (!keys.length) html = '<div class="empty">' + esc(T('noAnswers')) + '</div>';
  }
  el.innerHTML = html;
}

/* ───────── Q&A ───────── */

function renderQA() {
  var el = $('#v-qa'); if (!el) return;
  el.innerHTML =
    '<div class="box"><p class="hint" style="margin:0">' + esc(T('qaIntro')) + '</p>' +
    '<div class="seg2" id="qakind" style="align-self:flex-start"><button data-k="question">' + esc(T('kindQ')) + '</button><button data-k="word">' + esc(T('kindW')) + '</button></div>' +
    '<textarea id="qaTa" lang="' + S.lang + '" placeholder="' + esc(T('qaPh')) + '"></textarea>' +
    '<button class="btn" id="qaPost">' + esc(T('post')) + '</button></div>' +
    '<div class="chips" id="qaf" style="margin-top:12px"></div><div class="sec" id="qaList" style="margin-top:6px"></div>';
  var ta = $('#qaTa'); ta.value = S.qaDraft;
  ta.oninput = function () { S.qaDraft = ta.value; };
  var setKind = function () {
    [].forEach.call(document.querySelectorAll('#qakind button'), function (b) { b.classList.toggle('on', b.getAttribute('data-k') === S.qaKind); });
  };
  [].forEach.call(document.querySelectorAll('#qakind button'), function (b) {
    b.onclick = function () { S.qaKind = b.getAttribute('data-k'); setKind(); };
  });
  setKind();
  $('#qaPost').onclick = postQA;
  renderQAList();
}

function postQA() {
  var text = (S.qaDraft || '').trim();
  if (!text) { toast(T('emptyErr'), true); return; }
  var bt = $('#qaPost'); bt.disabled = true;
  WB.post({ type: 'qa_post', pid: S.pid, text: text, kind: S.qaKind, lang: S.lang }).then(function (r) {
    bt.disabled = false;
    if (r.ok) { S.qaDraft = ''; $('#qaTa').value = ''; toast(T('posted')); S.lastFetch.qa = 0; refresh('qa'); }
    else if (r.error === 'nopid') { WB.ls('wb.pid', null); showRegister(T('gone')); }
    else toast(T('fail'), true);
  });
}

function hhmm(ts) { try { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }

function qaItem(x, rm) {
  var r = rm[x.p], name = r ? r.n : '—', g = r && r.g;
  var tr = (x.l !== S.lang && x[S.lang]) ? x[S.lang] : null;
  var h = '<article class="qai' + (x.a ? ' done' : '') + (x.p === S.pid ? ' mine' : '') + '">' +
    '<div class="meta"><span class="tag ' + (x.k === 'word' ? 'w' : 'q') + '">' + esc(x.k === 'word' ? T('kindW') : T('kindQ')) + '</span>' +
    '<span class="tag ' + (x.a ? 'ok' : 'op') + '">' + esc(x.a ? T('answered') + ' ✓' : T('open')) + '</span>' +
    '<span>' + esc(name) + (x.p === S.pid ? ' (' + esc(T('mine')) + ')' : '') + '</span>' +
    (g ? '<span class="gb" style="--g:' + WB.gcolor(g) + ';height:20px;min-width:20px;font-size:11px">' + esc(g) + '</span>' : '') +
    '<span>' + esc(hhmm(x.ts)) + '</span></div>' +
    '<p lang="' + (tr ? S.lang : x.l) + '">' + esc(tr || x.t) + '</p>' +
    (tr ? '<div class="tr" lang="' + x.l + '"><small>' + esc(T('original')) + ' · ' + esc(WB.langName(x.l)) + '</small>' + esc(x.t) + '</div>' : '');
  if (x.ans) {
    var at = (x.ans.l !== S.lang && x.ans[S.lang]) ? x.ans[S.lang] : null;
    h += '<div class="ans"><b>' + esc(T('fAnswer')) + '</b><p lang="' + (at ? S.lang : x.ans.l) + '">' + esc(at || x.ans.t) + '</p>' +
      (at ? '<div class="tr" lang="' + x.ans.l + '"><small>' + esc(T('original')) + '</small>' + esc(x.ans.t) + '</div>' : '') + '</div>';
  }
  return h + '</article>';
}

function renderQAList() {
  var list = $('#qaList'), chips = $('#qaf'); if (!list) return;
  var rm = rosterMap();
  var nOpen = S.qa.filter(function (x) { return !x.a; }).length, nDone = S.qa.length - nOpen;
  var defs = [['all', T('all'), S.qa.length], ['open', T('open'), nOpen], ['done', T('answered'), nDone]];
  chips.innerHTML = defs.map(function (d) {
    return '<button class="chip' + (S.qaFilter === d[0] ? ' on' : '') + '" data-f="' + d[0] + '">' + esc(d[1]) + ' (' + d[2] + ')</button>';
  }).join('');
  [].forEach.call(chips.querySelectorAll('button'), function (b) { b.onclick = function () { S.qaFilter = b.getAttribute('data-f'); renderQAList(); }; });
  var shown = S.qa.filter(function (x) { return S.qaFilter === 'all' || (S.qaFilter === 'open' ? !x.a : x.a); });
  list.innerHTML = shown.length ? shown.map(function (x) { return qaItem(x, rm); }).join('') : '<div class="empty">' + esc(T('noQA')) + '</div>';
}

/* ───────── グループ ───────── */

function renderGroup() {
  var el = $('#v-g'); if (!el) return;
  var g = myGroup(), on = S.st && S.st.groupsOn;
  var html = '';
  if (!on || !g) {
    html = '<div class="wait"><h4>' + esc(T('groupWait')) + '</h4><p>' + esc(T('groupWaitSub')) + '</p></div>';
  } else {

/* ───────── 小さな道具 ───────── */

var toastT;

function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/** 自動配置。mix のときは所属ごとに散らして、同じ所属が同じ班に固まらないようにする */
function autoAssign(parts, mode, val, mix) {
  var n = parts.length; if (!n) return {};
  var k = mode === 'count' ? Math.max(1, val) : Math.max(1, Math.round(n / Math.max(1, val)));
  k = Math.min(k, n);
  var order = [];
  if (mix) {
    var by = {};
    parts.forEach(function (p) { var key = (p.aff || '').trim().toLowerCase(); (by[key] = by[key] || []).push(p); });
    shuffle(Object.keys(by)).sort(function (a, b) { return by[b].length - by[a].length; })
      .forEach(function (key) { order = order.concat(shuffle(by[key])); });
  } else order = shuffle(parts.slice());
  var idx = shuffle(Array.apply(null, Array(k)).map(function (_, i) { return i + 1; }));
  var out = {};
  order.forEach(function (p, i) { out[p.p] = String(idx[i % k]); });
  return out;
}
window.__autoAssign = autoAssign;     /* テスト用 */

function gChecks() {
  var P = A.d.participants, n = P.length, st = A.d.state, out = [];
  var un = P.filter(function (p) { return !A.draft[p.p]; });
  var sizes = {}, affs = {};
  P.forEach(function (p) {
    var g = A.draft[p.p]; if (!g) return;
    sizes[g] = (sizes[g] || 0) + 1; (affs[g] = affs[g] || []).push((p.aff || '').trim().toLowerCase());
  });
  var gs = Object.keys(sizes), vals = gs.map(function (g) { return sizes[g]; });
  out.push(n ? ['ok', '参加者 ' + n + '人を確認しました'] : ['ng', '参加者がまだいません']);
  if (st.expected) out.push(n === st.expected ? ['ok', '参加予定人数（' + st.expected + '人）と一致しています'] : ['wn', '参加予定 ' + st.expected + '人に対して、いま ' + n + '人です']);
  out.push(un.length ? ['ng', '未配置の人が ' + un.length + '人います：' + un.slice(0, 4).map(function (p) { return p.n; }).join('、') + (un.length > 4 ? '…' : '')] : (n ? ['ok', '全員がグループに入っています'] : ['wn', '配置する人がいません']));
  if (vals.length) {
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if (mn < 2) out.push(['wn', '1人だけのグループがあります']);
    if (mx - mn > 1) out.push(['wn', 'グループの人数に差があります（' + mn + '〜' + mx + '人）']);
    var same = gs.filter(function (g) { var a = affs[g]; return a.length > 1 && a[0] && a.every(function (x) { return x === a[0]; }); });
    if (same.length) out.push(['wn', 'グループ ' + same.join('・') + ' は、全員が同じ所属です']);
  }
  var keys = P.map(function (p) { return { n: p.n, k: nameKey(p.n) }; }), sim = [];
  for (var i = 0; i < keys.length; i++) for (var j = i + 1; j < keys.length; j++) {
    var a = keys[i].k, b = keys[j].k;
    if (a.length >= 3 && b.length >= 3 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) sim.push(keys[i].n + ' と ' + keys[j].n);
  }
  if (sim.length) out.push(['wn', '似た名前があります（同じ人なら、片方を削除してください）：' + sim.slice(0, 3).join('、')]);
  if (st.groupsOn) {
    var diff = P.filter(function (p) { return (A.draft[p.p] || '') !== (p.g || ''); }).length;
    out.push(diff ? ['wn', '反映済みのグループから変わる人：' + diff + '人'] : ['ok', '下書きは、反映済みのグループと同じです']);
  }
  return out;
}

function csvCell(c) {
  var s = String(c === undefined || c === null ? '' : c);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;                    /* Excel で数式として動かないように */
  return '"' + s.replace(/"/g, '""') + '"';
}
function download(name, rows) {
  var text = '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  var b = new Blob([text], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp() { var n = new Date(); return n.getFullYear() + ('0' + (n.getMonth() + 1)).slice(-2) + ('0' + n.getDate()).slice(-2) + '-' + ('0' + n.getHours()).slice(-2) + ('0' + n.getMinutes()).slice(-2); }

function langSel(id) {
  return '<select id="' + id + '" style="width:auto;min-height:42px;font-size:14px"><option value="ja"' + (A.ansLang === 'ja' ? ' selected' : '') + '>表示：日本語</option><option value="en"' + (A.ansLang === 'en' ? ' selected' : '') + '>表示：English</option><option value="bn"' + (A.ansLang === 'bn' ? ' selected' : '') + '>表示：বাংলা</option><option value="orig"' + (A.ansLang === 'orig' ? ' selected' : '') + '>表示：原文のまま</option></select>';
}

function pAnswers(el) {
  var d = A.d, Q = d.questions, pm = pmap(), P = d.participants.slice();
  P.sort(function (a, b) { return (parseInt(A.draft[a.p] || a.g, 10) || 999) - (parseInt(A.draft[b.p] || b.g, 10) || 999) || WB.cmp(a.n, b.n); });
  var have = {}; d.answers.forEach(function (a) { have[a.p + '|' + a.q] = 1; });
  var cnt = {}; Q.forEach(function (q) { cnt[q.id] = d.answers.filter(function (a) { return a.q === q.id; }).length; });
  var rows = P.filter(function (p) { return !A.onlyMissing || Q.some(function (q) { return !have[p.p + '|' + q.id]; }); });
  var items = d.answers.filter(function (a) { return pm[a.p] && (!A.ansQ || a.q === A.ansQ); })
    .sort(function (a, b) { return qNo(a.q) - qNo(b.q) || (parseInt(pm[a.p].g, 10) || 999) - (parseInt(pm[b.p].g, 10) || 999) || WB.cmp(pm[a.p].n, pm[b.p].n); });
  el.innerHTML =
    '<div class="box"><h3>提出状況（○ = 提出済み）</h3><label class="chk"><input type="checkbox" id="aMiss"' + (A.onlyMissing ? ' checked' : '') + '> 未提出がある人だけ表示</label>' +
    (Q.length && P.length ? '<div class="scroll"><table class="tbl"><thead><tr><th>名前</th><th class="c">G</th>' + Q.map(function (q, i) { return '<th class="c">問' + (i + 1) + '<br><span style="font-weight:400">' + cnt[q.id] + '/' + P.length + '</span></th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (p) {
        return '<tr><td lang="' + (/[ঀ-৿]/.test(p.n) ? 'bn' : 'ja') + '">' + esc(p.n) + '</td><td class="c">' + esc(p.g || '') + '</td>' + Q.map(function (q) { return have[p.p + '|' + q.id] ? '<td class="c ok">○</td>' : '<td class="c no">—</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">問い・参加者が揃うと表示されます</div>') + '</div>' +
    '<div class="box"><h3>回答の一覧</h3><div class="row2">' + langSel('aLang') + '<select id="aQ" style="width:auto;min-height:42px;font-size:14px"><option value="">すべての問い</option>' + Q.map(function (q, i) { return '<option value="' + q.id + '"' + (A.ansQ === q.id ? ' selected' : '') + '>問い ' + (i + 1) + '</option>'; }).join('') + '</select>' +
    '<span class="sp" style="flex:1"></span><button class="btn2 k" id="aCsv">回答をCSVで保存</button><button class="btn2" id="aCsvQA">Q&AをCSVで保存</button></div>' +
    (items.length ? '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">' + items.map(function (a) {
      var p = pm[a.p], shown = disp(a, A.ansLang), tr = A.ansLang !== 'orig' && a.l !== A.ansLang && a[A.ansLang];
      return '<div class="cardn" style="--g:' + (p.g ? WB.gcolor(p.g) : '#8C8275') + '"><div class="wh">' + esc(p.n) + ' · ' + (p.g ? 'G' + esc(p.g) : '未定') + ' · 問' + qNo(a.q) + '</div><p lang="' + (tr ? A.ansLang : a.l) + '">' + esc(shown) + '</p>' +
        (tr ? '<div class="tr" lang="' + a.l + '"><small>原文 · ' + LNAME[a.l] + '</small>' + esc(a.t) + '</div>' : '') + '</div>';
    }).join('') + '</div>' : '<div class="empty">該当する回答はまだありません</div>') + '</div>';

  $('#aMiss').onchange = function () { A.onlyMissing = this.checked; pAnswers(el); };
  $('#aLang').onchange = function () { A.ansLang = this.value; WB.ls('wb.alang', this.value); pAnswers(el); };
  $('#aQ').onchange = function () { A.ansQ = this.value; pAnswers(el); };
  $('#aCsv').onclick = function () {
    var q = {}; Q.forEach(function (x) { q[x.id] = x; });
    var out = [['参加者ID', '名前', '所属', 'グループ', '問いID', '問い', '問いの文（日本語）', '原文の言語', '回答（原文）', '日本語', 'English', 'বাংলা', '版', '時刻']];
    d.answers.slice().sort(function (a, b) { return qNo(a.q) - qNo(b.q) || WB.cmp(a.p, b.p); }).forEach(function (a) {
      var p = pm[a.p] || {}, qq = q[a.q] || {};
      out.push([a.p, p.n, p.aff, p.g, a.q, '問' + qNo(a.q), qq.ja || qq.en || '', a.l, a.t, a.ja, a.en, a.bn, a.r, new Date(a.ts).toLocaleString()]);
    });
    download('answers-' + stamp() + '.csv', out);
  };
  $('#aCsvQA').onclick = function () {
    var out = [['ID', '時刻', '名前', 'グループ', '種別', '言語', '本文（原文）', '日本語', 'English', 'বাংলা', '回答済み', '運営の回答（原文）', '日本語', 'English', 'বাংলা']];
    d.qa.slice().reverse().forEach(function (x) {
      var p = pm[x.p] || {}, a = x.ans || {};
      out.push([x.id, new Date(x.ts).toLocaleString(), p.n, p.g, x.k === 'word' ? '言葉' : '質問', x.l, x.t, x.ja, x.en, x.bn, x.a ? '済' : '', a.t, a.ja, a.en, a.bn]);
    });
    download('qa-' + stamp() + '.csv', out);
  };
}

/* 写真を縮小して JPEG の文字列にする（長辺 1280px まで。大きすぎれば、さらに小さくする） */
var IMG_MAX_CHARS = 470000;
function resizeImage(file) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onerror = reject;
    fr.onload = function () {
      var img = new Image();
      img.onerror = reject;
      img.onload = function () {
        var steps = [[1280, 0.82], [1280, 0.7], [1024, 0.7], [800, 0.65], [640, 0.6]], out = '';
        for (var i = 0; i < steps.length; i++) {
          var sc = Math.min(1, steps[i][0] / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
          out = c.toDataURL('image/jpeg', steps[i][1]);
          if (out.length <= IMG_MAX_CHARS) return resolve(out);
        }
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 運営画面の見本表示（一度取った写真は覚えておく） */
function showThumb(q, img) {
  if (!img) return;
  var im = A.imgs[q.id];
  if (im && im.ver === q.img && im.data) { img.src = im.data; return; }
  WB.get('image', { qid: q.id, v: q.img }).then(function (r) {
    if (r && r.ok && r.data) { A.imgs[q.id] = { ver: r.ver, data: r.data }; if (img.isConnected !== false) img.src = r.data; }
  });
}

/* ───────── コメント（「考える」タブ） ───────── */

function pComments(el) {
  var d = A.d, pm = pmap(), Q = d.questions, all = d.comments || [];
  var shown = all.filter(function (c) { return !A.cmQ || c.q === A.cmQ; }).sort(function (a, b) { return b.ts - a.ts; });
  el.innerHTML =
    '<div class="infobox">参加者が「考える」タブに書いたコメントです。不適切なものは「削除」で全員の画面から消せます。</div>' +
    '<div class="row2">' + langSel('cmLang') + '<select id="cmQ" style="width:auto;min-height:42px;font-size:14px"><option value="">すべての問い（' + all.length + '件）</option>' +
      Q.map(function (q, i) { return '<option value="' + q.id + '"' + (A.cmQ === q.id ? ' selected' : '') + '>問い ' + (i + 1) + '（' + all.filter(function (c) { return c.q === q.id; }).length + '件）</option>'; }).join('') + '</select>' +
    '<span style="flex:1"></span><button class="btn2 k" id="cmCsv">コメントをCSVで保存</button></div>' +
    (shown.length ? '<div style="display:flex;flex-direction:column;gap:10px">' + shown.map(function (c) {
      var p = pm[c.p] || { n: '—' }, tr = A.ansLang !== 'orig' && c.l !== A.ansLang && c[A.ansLang];
      return '<article class="qai" data-id="' + c.id + '"><div class="meta"><span class="tag q">問い ' + qNo(c.q) + '</span><b>' + esc(p.n) + '</b>' +
        (p.g ? '<span class="gb" style="--g:' + WB.gcolor(p.g) + ';height:20px;min-width:20px;font-size:11px">' + esc(p.g) + '</span>' : '') + '<span>' + esc(hhmm(c.ts)) + '</span></div>' +
        '<p lang="' + (tr ? A.ansLang : c.l) + '">' + esc(disp(c, A.ansLang)) + '</p>' +
        (tr ? '<div class="tr" lang="' + c.l + '"><small>原文 · ' + LNAME[c.l] + '</small>' + esc(c.t) + '</div>' : '') +
        '<div class="row2"><button class="btn2 r" data-rm>削除</button></div></article>';
    }).join('') + '</div>' : '<div class="empty">まだコメントはありません</div>');
  $('#cmLang').onchange = function () { A.ansLang = this.value; WB.ls('wb.alang', this.value); pComments(el); };
  $('#cmQ').onchange = function () { A.cmQ = this.value; pComments(el); };
  $$('.qai', el).forEach(function (row) {
    $('[data-rm]', row).onclick = function () {
      if (!confirm('このコメントを削除しますか？（参加者の画面からも消えます）')) return;
      call({ type: 'a_c_del', id: row.getAttribute('data-id') }).then(function (r) { if (r && r.ok) { toast('削除しました'); load(); } else toast('削除できませんでした', true); });
    };
  });
  $('#cmCsv').onclick = function () {
    var out = [['ID', '時刻', '問い', '名前', 'グループ', '言語', 'コメント（原文）', '日本語', 'English', 'বাংলা']];
    all.slice().sort(function (a, b) { return qNo(a.q) - qNo(b.q) || a.ts - b.ts; }).forEach(function (c) {
      var p = pm[c.p] || {};
      out.push([c.id, new Date(c.ts).toLocaleString(), '問' + qNo(c.q), p.n, p.g, c.l, c.t, c.ja, c.en, c.bn]);
    });
    download('comments-' + stamp() + '.csv', out);
  };
}

/* ───────── Q&A ───────── */

function pQA(el) {
  var d = A.d, pm = pmap(), all = d.qa;
  var nOpen = all.filter(function (x) { return !x.a; }).length;
  var shown = all.filter(function (x) { return A.qaFilter === 'all' || (A.qaFilter === 'open' ? !x.a : x.a); })
    .sort(function (a, b) { return (a.a - b.a) || (b.ts - a.ts); });
  var chip = function (k, label, n) { return '<button class="chip' + (A.qaFilter === k ? ' on' : '') + '" data-f="' + k + '">' + label + ' (' + n + ')</button>'; };
  el.innerHTML =
    '<div class="infobox">参加者がいつでも書き込める質問・言葉の一覧です。口頭で答えたときや、後で調べて答えたときに「回答済み」にチェックしてください。参加者の画面にも「回答済み」と表示されます。回答の文を書くと、3言語に自動翻訳されて表示されます。</div>' +
    '<div class="row2"><div class="chips">' + chip('open', '未回答', nOpen) + chip('done', '回答済み', all.length - nOpen) + chip('all', 'すべて', all.length) + '</div><span style="flex:1"></span>' + langSel('qLang') + '</div>' +
    (shown.length ? '<div style="display:flex;flex-direction:column;gap:10px">' + shown.map(function (x) {
      var p = pm[x.p] || { n: '—' }, tr = A.ansLang !== 'orig' && x.l !== A.ansLang && x[A.ansLang];
      var draft = A.qaDraft[x.id] !== undefined ? A.qaDraft[x.id] : (x.ans ? x.ans.t : '');
      return '<article class="qai' + (x.a ? ' done' : '') + '" data-id="' + x.id + '"><div class="meta"><span class="tag ' + (x.k === 'word' ? 'w' : 'q') + '">' + (x.k === 'word' ? '言葉・用語' : '質問') + '</span><b>' + esc(p.n) + '</b>' + (p.g ? '<span class="gb" style="--g:' + WB.gcolor(p.g) + ';height:20px;min-width:20px;font-size:11px">' + esc(p.g) + '</span>' : '') + '<span>' + esc(hhmm(x.ts)) + '</span></div>' +
        '<p lang="' + (tr ? A.ansLang : x.l) + '">' + esc(disp(x, A.ansLang)) + '</p>' + (tr ? '<div class="tr" lang="' + x.l + '"><small>原文 · ' + LNAME[x.l] + '</small>' + esc(x.t) + '</div>' : '') +
        '<label class="chk"><input type="checkbox" data-done' + (x.a ? ' checked' : '') + '> 回答済みにする</label>' +
        '<textarea data-ans placeholder="回答の文（任意。書くと参加者に表示され、3言語に翻訳されます）" style="min-height:70px;font-size:15px;border-top-width:1px">' + esc(draft) + '</textarea>' +
        '<div class="row2"><button class="btn2 k" data-save>回答文を保存</button><button class="btn2 r" data-rm>削除</button>' + (x.ans ? '<span class="small">公開中の回答：' + LNAME[x.ans.l] + ' → 自動翻訳済み</span>' : '') + '</div></article>';
    }).join('') + '</div>' : '<div class="empty">該当する投稿はありません</div>');

  $$('[data-f]', el).forEach(function (b) { b.onclick = function () { A.qaFilter = b.getAttribute('data-f'); pQA(el); }; });
  $('#qLang').onchange = function () { A.ansLang = this.value; WB.ls('wb.alang', this.value); pQA(el); };
  $$('.qai', el).forEach(function (row) {
    var id = row.getAttribute('data-id');
    $('[data-ans]', row).oninput = function () { A.qaDraft[id] = this.value; };
    $('[data-done]', row).onchange = function () {
      var on = this.checked;
      call({ type: 'a_qa', id: id, answered: on }).then(function (r) { if (r && r.ok) { toast(on ? '回答済みにしました' : '未回答に戻しました'); load(); } else toast('保存できませんでした', true); });
    };
    $('[data-save]', row).onclick = function () {
      var txt = ($('[data-ans]', row).value || '').trim(), b = this; b.disabled = true;
      call({ type: 'a_qa', id: id, answer: txt, alang: 'ja', answered: txt ? true : undefined }).then(function (r) {
        b.disabled = false;
        if (r && r.ok) { delete A.qaDraft[id]; toast(txt ? '回答を保存し、回答済みにしました' : '回答文を消しました'); load(); } else toast('保存できませんでした', true);
      });
    };
    $('[data-rm]', row).onclick = function () {
      if (!confirm('この投稿を削除しますか？（参加者の画面からも消えます）')) return;
      call({ type: 'a_qa', id: id, del: true }).then(function (r) { if (r && r.ok) { toast('削除しました'); load(); } });
    };
  });
}

/* ───────── 設定 ───────── */

function pSettings(el) {
  var S = A.set;
  el.innerHTML =
    '<div class="box"><h3>基本設定</h3>' +
    '<div><label class="small" for="sTitle">ワークショップの名前（参加者の画面の上に出ます）</label><input type="text" id="sTitle" maxlength="80" value="' + esc(S.title) + '"></div>' +
    '<div><label class="small" for="sLang">はじめて開いた人の画面の言語（端末の設定が優先されます）</label><select id="sLang"><option value="ja">日本語</option><option value="en">English</option><option value="bn">বাংলা</option></select></div>' +
    '<div><label class="small" for="sExp">参加予定人数（グループ確認のチェックに使います。0 なら使いません）</label><input type="number" id="sExp" min="0" class="inp" value="' + (+S.expected || 0) + '"></div>' +
    '<div class="row2"><button class="btn sm" id="sSave"' + (A.sDirty ? '' : ' disabled') + '>保存</button></div></div>' +
    '<div class="box"><h3>本番前の準備と、データの消し方</h3><div class="small" style="line-height:1.9">' +
    '・リハーサルのデータを消すときは、Apps Script のエディタで関数 <b>resetData</b> を選んで「実行」します（参加者・回答・Q&A・タイマー・グループが消え、問いと設定は残ります）。消したものは戻らないので、必要なら先にスプレッドシートを複製してください。<br>' +
    '・合言葉を変えるときは、Code.gs の <b>ADMIN_PASS</b> を書き換えて、「デプロイを管理 → 新バージョン」で更新します。<br>' +
    '・翻訳の言語を増やすときは、i18n.js と Code.gs の LANGS に言語を足します（README を参照）。</div></div>';
  $('#sLang').value = S.defaultLang;
  var dirty = function () { A.sDirty = true; $('#sSave').disabled = false; };
  $('#sTitle').oninput = function () { S.title = this.value; dirty(); };
  $('#sLang').onchange = function () { S.defaultLang = this.value; dirty(); };
  $('#sExp').oninput = function () { S.expected = parseInt(this.value, 10) || 0; dirty(); };
  $('#sSave').onclick = function () {
    var b = this; b.disabled = true;
    call({ type: 'a_settings', title: S.title, defaultLang: S.defaultLang, expected: S.expected }).then(function (r) {
      if (r && r.ok) { A.sDirty = false; toast('保存しました'); load(); } else { b.disabled = false; toast('保存できませんでした', true); }
    });
  };
}

/* ───────── 起動 ───────── */

var saved = WB.ss('wb.apass');
if (saved) {
  WB.post({ type: 'a_auth', pass: saved }).then(function (r) {
    if (r && r.ok) { A.pass = saved; start(); } else showLogin();
  });
} else showLogin();
}

  var rb = document.createElement('meta'); rb.name = 'robots'; rb.content = 'noindex,nofollow'; document.head.appendChild(rb);
  document.getElementById('app').className = 'wrap admin';
  runAdmin();

  runParticipant();
}
